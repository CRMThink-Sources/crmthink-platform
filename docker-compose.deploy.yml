# Deploy (staging/produção) na VPS. Imagem, portas e projeto vêm de variáveis dos
# GitHub Environments; o `.env` é montado pelo pipeline a partir das Variables e Secrets do Environment.
#
# Roda na rede externa `crmthink` (ops/droplet): MySQL em `mysql:3306`, Redis em
# `redis:6379` e o Caddy faz proxy para `<COMPOSE_PROJECT>-api:4100`. As portas ficam só
# em 127.0.0.1 (o Docker ignora o UFW): acesso externo apenas pelo Caddy.
#
# O nome dos containers começa com `crmthink-platform-` para o Promtail coletar.
services:
  api:
    image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-crmthink-platform}-api
    restart: unless-stopped
    env_file: ./.env
    environment:
      PORT: '4100'
    ports:
      - '127.0.0.1:${API_PORT:-4100}:4100'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  worker:
    image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-crmthink-platform}-worker
    restart: unless-stopped
    command: ['node', 'dist/src/worker.js']
    env_file: ./.env
    environment:
      PORT: '9464'
    ports:
      - '127.0.0.1:${WORKER_METRICS_PORT:-9464}:9464'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

networks:
  default:
    name: crmthink
    external: true
