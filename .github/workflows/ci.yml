name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/crmthink-platform

jobs:
  ci:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn check-types
      - run: yarn test

  migrations:
    name: Migrações num MySQL real
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx prisma migrate deploy
      # O schema tem que bater com as migrações (nenhuma mudança sem migração).
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  build:
    name: Imagem Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [ci, migrations]
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "tag=production" >> "$GITHUB_OUTPUT"; else echo "tag=staging" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ steps.tag.outputs.tag }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ steps.tag.outputs.tag }},mode=max
          provenance: false

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    # Destino do deploy (host, usuário, chave, diretório, projeto compose, portas) vem
    # das variáveis e secrets do GitHub Environment — nunca do código:
    #   vars:    DEPLOY_HOST, DEPLOY_USER, DEPLOY_DIR, COMPOSE_PROJECT, API_PORT, WORKER_METRICS_PORT
    #   secrets: DEPLOY_SSH_KEY, DEPLOY_SSH_KEY_PASSPHRASE (opcional), ENV_PLATFORM (conteúdo do .env)
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      PLATFORM_IMAGE: ghcr.io/${{ github.repository_owner }}/crmthink-platform:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Copiar compose para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          source: docker-compose.deploy.yml
          target: ${{ vars.DEPLOY_DIR }}

      - name: Escrever .env, migrar e subir
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_PLATFORM: ${{ secrets.ENV_PLATFORM }}
          PLATFORM_IMAGE: ${{ env.PLATFORM_IMAGE }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT }}
          API_PORT: ${{ vars.API_PORT }}
          WORKER_METRICS_PORT: ${{ vars.WORKER_METRICS_PORT }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          envs: GH_TOKEN,ENV_PLATFORM,PLATFORM_IMAGE,DEPLOY_DIR,COMPOSE_PROJECT,API_PORT,WORKER_METRICS_PORT,ACTOR
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            umask 077
            printf '%s\n' "$ENV_PLATFORM" > .env
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull "$PLATFORM_IMAGE"
            docker run --rm --network host --env-file .env "$PLATFORM_IMAGE" npx prisma migrate deploy
            export PLATFORM_IMAGE API_PORT WORKER_METRICS_PORT
            export COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT"
            docker compose -p "$COMPOSE_PROJECT" -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
